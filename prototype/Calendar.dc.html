<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>日历 · 时间簿</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
button{cursor:pointer}
a{text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #111827;outline-offset:2px}

/* —— 表面 —— */
.card{background:#FFFFFF;border:1px solid #E8EAF1;border-radius:20px;
 box-shadow:0 1px 2px rgba(17,24,39,.04),0 10px 24px -16px rgba(17,24,39,.16);
 transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .28s}
.lift:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(17,24,39,.05),0 20px 36px -18px rgba(17,24,39,.26)}

/* —— 按钮：黄色只给"主操作" —— */
.btn{border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;white-space:nowrap;
 transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,background-color .2s,color .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.97);transition-duration:.1s}
.primary{background:#FFD43B;color:#111827;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 18px -10px rgba(214,160,0,.9)}
.primary:hover{background:#FFCC1A;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 14px 24px -12px rgba(214,160,0,.95)}
.dark{background:#111827;color:#FFFFFF}
.dark:hover{background:#000000}
.soft{background:#F2F3F7;color:#111827}
.soft:hover{background:#E9EBF2}
.go:hover{background:#FFD43B}
.ghost{background:#FFFFFF;color:#111827;box-shadow:inset 0 0 0 1.5px #E1E4EC}
.ghost:hover{box-shadow:inset 0 0 0 1.5px #C9CDD8}
.icon{width:40px;height:40px;border-radius:12px;padding:0}

/* —— 小标签 —— */
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap}
.count{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:#EEF0F5;color:#4B5263;font-size:13px;font-weight:800}

/* —— 时间线 —— */
.row{border:0;background:transparent;border-radius:14px;transition:transform .22s cubic-bezier(.2,.8,.2,1),background-color .2s}
.row:hover{background:#F5F6FA;transform:translateY(-2px)}
.gap{border:1.5px dashed #FFB38A;background:#FFF7F1;border-radius:14px;transition:transform .22s cubic-bezier(.2,.8,.2,1),background-color .2s}
.gap:hover{background:#FFEFE3;transform:translateY(-2px)}
.gapseg{border:0;padding:0;background:repeating-linear-gradient(-45deg,#FFE3D1 0 4px,#FFF6F0 4px 8px);box-shadow:inset 0 0 0 1.5px #FFB38A;transition:filter .2s}
.gapseg:hover{filter:brightness(.95)}
.runseg{background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.4) 0 5px,rgba(255,255,255,0) 5px 10px);background-size:20px 100%;animation:stripes 1s linear infinite}

/* —— 表单 —— */
.field{height:48px;border:0;border-radius:12px;background:#F5F6FA;box-shadow:inset 0 0 0 1.5px #E1E4EC;padding:0 14px;font-size:20px;font-weight:800;color:#111827;font-variant-numeric:tabular-nums;box-sizing:border-box}
.field:focus{outline:none;box-shadow:inset 0 0 0 2px #111827;background:#FFFFFF}

@keyframes ping{0%{box-shadow:0 0 0 0 currentColor}80%,100%{box-shadow:0 0 0 8px transparent}}
@keyframes rise{from{opacity:.001;translate:0 12px}to{opacity:1;translate:0 0}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes stripes{to{background-position:20px 0}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}
.live{width:9px;height:9px;border-radius:50%;background:currentColor;animation:ping 1.6s ease-out infinite;flex:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.blk{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.blk:hover{transform:translateY(-2px);box-shadow:0 8px 16px -8px rgba(17,24,39,.3);z-index:3}
.col{cursor:crosshair;user-select:none;-webkit-user-select:none}
</style>
</helmet>
<div onMouseUp="{{ endDrag }}" onMouseLeave="{{ endDrag }}" style="min-height:100vh;background:#F6F7FA;color:#111827;font-family:'Plus Jakarta Sans','Noto Sans SC',sans-serif;display:flex;flex-direction:column">
  <header style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:20px 40px;box-sizing:border-box;width:100%;max-width:1360px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:40px;height:40px;border-radius:12px;background:#FFD43B;display:flex;align-items:center;justify-content:center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </div>
      <div style="font-size:20px;font-weight:800;letter-spacing:-0.01em">时间簿</div>
    </div>
    <nav class="card" aria-label="主导航" style="display:flex;gap:2px;border-radius:14px;padding:4px">
      <a href="Today.dc.html" class="btn" style="height:40px;padding:0 20px;border-radius:10px;font-size:14px;color:#4B5263;background:transparent">今日</a>
      <a href="Calendar.dc.html" aria-current="page" class="btn dark" style="height:40px;padding:0 20px;border-radius:10px;font-size:14px">日历</a>
      <a href="Stats.dc.html" class="btn" style="height:40px;padding:0 20px;border-radius:10px;font-size:14px;color:#4B5263;background:transparent">统计</a>
      <a href="Tags.dc.html" class="btn" style="height:40px;padding:0 20px;border-radius:10px;font-size:14px;color:#4B5263;background:transparent">标签</a>
    </nav>
    <button onClick="{{ syncCycle }}" class="btn" title="{{ syncTip }}" aria-label="{{ syncLabel }}：{{ syncTip }}" style="height:34px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;background:{{ syncBg }};color:{{ syncFg }};box-shadow:{{ syncRing }}">
      <span class="{{ syncDotCls }}" style="width:8px;height:8px;border-radius:50%;background:{{ syncDot }};color:{{ syncDot }};flex:none"></span>{{ syncLabel }}
    </button>
  </header>
  <main style="flex:1;box-sizing:border-box;width:100%;max-width:1360px;margin:0 auto;padding:4px 40px 64px;display:flex;flex-direction:column;gap:20px">
    <section style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px">
      <div>
        <h1 style="margin:0;font-size:34px;line-height:1.15;font-weight:800;letter-spacing:-0.02em">日历</h1>
        <div style="margin-top:6px;font-size:14px;font-weight:600;color:#6B7280">在空白处按住往下拖，就能补一段记录；点色块可以修改</div>
      </div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px">
        <div style="display:flex;gap:12px">
          <sc-for list="{{ legend }}" as="l" hint-placeholder-count="4">
            <span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#4B5263"><span style="width:10px;height:10px;border-radius:3px;background:{{ l.color }}"></span>{{ l.name }}</span>
          </sc-for>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <button onClick="{{ prevWeek }}" class="btn ghost icon" aria-label="上一周">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <div style="min-width:120px;text-align:center">
            <div style="font-size:16px;font-weight:800;font-variant-numeric:tabular-nums">{{ weekLabel }}</div>
            <div style="font-size:12px;font-weight:600;color:#6B7280">合计 {{ weekTotal }}</div>
          </div>
          <button onClick="{{ nextWeek }}" class="btn ghost icon" aria-label="下一周" style="opacity:{{ nextOp }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
          <button onClick="{{ thisWeek }}" class="btn soft" style="height:40px;padding:0 14px;border-radius:12px;font-size:14px">本周</button>
        </div>
      </div>
    </section>

    <div class="card" style="overflow:hidden">
      <div style="display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));border-bottom:1px solid #EEF0F5">
        <div></div>
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
          <div style="padding:12px 6px 10px;text-align:center;border-left:1px solid #EEF0F5">
            <div style="font-size:12px;font-weight:700;color:#6B7280">{{ d.wk }}</div>
            <div style="display:inline-block;margin-top:4px;padding:2px 10px;border-radius:10px;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;background:{{ d.dateBg }}">{{ d.md }}</div>
            <div style="margin-top:4px;font-size:12px;font-weight:700;color:#4B5263;font-variant-numeric:tabular-nums">{{ d.total }}</div>
          </div>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr))">
        <div style="position:relative;height:{{ H }}px">
          <sc-for list="{{ hours }}" as="h" hint-placeholder-count="10">
            <div style="position:absolute;right:10px;top:{{ h.top }}px;transform:translateY(-50%);font-size:11px;font-weight:700;color:#9CA3AF;font-variant-numeric:tabular-nums">{{ h.label }}</div>
          </sc-for>
        </div>
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
          <div class="col" onMouseDown="{{ d.down }}" onMouseMove="{{ d.move }}" style="position:relative;height:{{ H }}px;border-left:1px solid #EEF0F5;background-color:{{ d.colBg }};background-image:repeating-linear-gradient(to bottom,#EEF0F5 0 1px,transparent 1px {{ PX }}px)">
            <sc-for list="{{ d.blocks }}" as="b" hint-placeholder-count="3">
              <button data-block="1" onClick="{{ b.open }}" class="blk" aria-label="{{ b.aria }}" title="{{ b.aria }}" style="position:absolute;top:{{ b.top }}px;height:{{ b.h }}px;left:calc({{ b.left }}% + 3px);width:calc({{ b.width }}% - 6px);background:{{ b.tint }};border:0;border-left:3px solid {{ b.color }};border-radius:8px;color:{{ b.ink }};text-align:left;padding:{{ b.pad }};overflow:hidden;box-sizing:border-box;z-index:1;display:flex;flex-direction:column;justify-content:{{ b.just }};align-items:stretch">
                <div style="font-size:12px;font-weight:800;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ b.name }}</div>
                <div style="font-size:11px;font-weight:600;line-height:1.3;white-space:nowrap;display:{{ b.rangeDisp }}">{{ b.range }}</div>
              </button>
            </sc-for>
            <sc-if value="{{ d.hasNow }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;left:0;right:0;top:{{ d.nowTop }}px;height:2px;background:#111827;z-index:2;pointer-events:none"><span style="position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#111827"></span></div>
            </sc-if>
            <sc-if value="{{ d.hasDrag }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;left:3px;right:3px;top:{{ d.dragTop }}px;height:{{ d.dragH }}px;border:1.5px dashed #F2711C;background:rgba(255,239,227,.92);border-radius:8px;z-index:4;pointer-events:none;padding:4px 6px;box-sizing:border-box;font-size:12px;font-weight:800;color:#9A3A0A;font-variant-numeric:tabular-nums">{{ d.dragLabel }}</div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
  <sc-if value="{{ edOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;background:rgba(17,24,39,.35);animation:fade .2s both;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;z-index:11">
      <div role="dialog" aria-label="{{ edTitle }}" class="card" style="animation:pop .3s cubic-bezier(.2,.8,.2,1) both;border-radius:24px;padding:28px;width:100%;max-width:600px;max-height:92vh;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:22px">
        <div>
          <h2 style="margin:0;font-size:24px;font-weight:800">{{ edTitle }}</h2>
          <div style="margin-top:4px;font-size:14px;font-weight:600;color:#6B7280">{{ edHint }}</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="font-size:13px;font-weight:800;color:#4B5263">做的是什么</div>
          <sc-for list="{{ edGroups }}" as="g" hint-placeholder-count="4">
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">
              <span style="width:40px;font-size:12px;font-weight:700;color:#9CA3AF">{{ g.name }}</span>
              <sc-for list="{{ g.tags }}" as="x" hint-placeholder-count="3">
                <button class="btn" onClick="{{ x.pick }}" aria-pressed="{{ x.sel }}" style="height:36px;padding:0 12px;border-radius:10px;background:{{ x.bg }};box-shadow:{{ x.ring }};color:{{ x.fg }};font-size:13px;font-weight:700"><span style="width:7px;height:7px;border-radius:50%;background:{{ g.color }}"></span>{{ x.name }}</button>
              </sc-for>
            </div>
          </sc-for>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="font-size:13px;font-weight:800;color:#4B5263">哪一天</div>
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">
            <sc-for list="{{ edDays }}" as="q" hint-placeholder-count="3">
              <button class="btn" onClick="{{ q.pick }}" style="height:38px;padding:0 14px;border-radius:10px;background:{{ q.bg }};color:{{ q.fg }};box-shadow:{{ q.ring }};font-size:13px">{{ q.label }}</button>
            </sc-for>
            <label for="edDate" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">日期</label>
            <input id="edDate" type="date" class="field" value="{{ edDate }}" onInput="{{ onEdDate }}" style="height:38px;font-size:14px;width:170px">
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="font-size:13px;font-weight:800;color:#4B5263">从几点到几点</div>
          <div style="display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px">
            <div style="display:flex;flex-direction:column;gap:6px">
              <label for="edS" style="font-size:12px;font-weight:700;color:#9CA3AF">开始</label>
              <input id="edS" type="time" class="field" value="{{ edS }}" onInput="{{ onEdS }}" style="width:168px">
              <div style="display:flex;gap:6px">
                <button class="btn soft" onClick="{{ sMinus }}" style="flex:1;height:32px;border-radius:9px;font-size:12px">−15 分</button>
                <button class="btn soft" onClick="{{ sPlus }}" style="flex:1;height:32px;border-radius:9px;font-size:12px">+15 分</button>
              </div>
            </div>
            <div style="padding-top:36px;color:#C3C7D1">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px">
              <label for="edE" style="font-size:12px;font-weight:700;color:#9CA3AF">结束 {{ edNext }}</label>
              <input id="edE" type="time" class="field" value="{{ edE }}" onInput="{{ onEdE }}" style="width:168px">
              <div style="display:flex;gap:6px">
                <button class="btn soft" onClick="{{ eMinus }}" style="flex:1;height:32px;border-radius:9px;font-size:12px">−15 分</button>
                <button class="btn soft" onClick="{{ ePlus }}" style="flex:1;height:32px;border-radius:9px;font-size:12px">+15 分</button>
              </div>
            </div>
            <div style="margin-left:auto;padding-top:22px;text-align:right">
              <div style="font-size:12px;font-weight:700;color:#9CA3AF">时长</div>
              <div style="font-size:24px;font-weight:800;font-variant-numeric:tabular-nums">{{ edDur }}</div>
            </div>
          </div>
          <sc-if value="{{ edOverlap }}" hint-placeholder-val="{{ false }}">
            <div style="font-size:13px;font-weight:600;color:#4B5263;background:#F5F6FA;border-radius:12px;padding:10px 12px">和「{{ edOverlapText }}」有重叠。可以照常保存，同一时间本来就能做两件事。</div>
          </sc-if>
        </div>

        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:4px;border-top:1px solid #EEF0F5">
          <sc-if value="{{ edIsEdit }}" hint-placeholder-val="{{ false }}">
            <button onClick="{{ edDelete }}" class="btn" style="height:44px;padding:0 8px;background:transparent;color:#D02246;font-size:14px">删除这条</button>
          </sc-if>
          <span style="flex:1"></span>
          <button onClick="{{ edClose }}" class="btn ghost" style="height:46px;padding:0 20px;border-radius:12px;font-size:15px;margin-top:14px">取消</button>
          <button onClick="{{ edSave }}" class="btn primary" style="height:46px;padding:0 28px;border-radius:12px;font-size:15px;margin-top:14px;opacity:{{ edSaveOp }}">保存</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":1060}}'>
class Component extends DCLogic {
  lib() {
    if (this._lib) return this._lib;
    const TODAY = '2026-11-15';
    // 模块色只用于数据：色 / 浅底 / 深字 / 描边
    const MODS = {
      '工作': { c: '#4F7BFF', tint: '#EDF1FF', ink: '#2D4FCC', line: '#C9D5FF' },
      '学习': { c: '#8B5CF6', tint: '#F2EDFF', ink: '#6236D6', line: '#DCCDFF' },
      '游戏': { c: '#14B8A6', tint: '#E6F7F4', ink: '#0B7F72', line: '#B5E9E1' },
      '锻炼': { c: '#F43F5E', tint: '#FFEDF0', ink: '#C8203E', line: '#FFC9D2' }
    };
    const TAGS = [
      { id: 't1', name: '淘教', mod: '工作' }, { id: 't2', name: '个人工作', mod: '工作' },
      { id: 't3', name: '行者', mod: '工作' }, { id: 't4', name: '各培训机构合作', mod: '工作' },
      { id: 't5', name: 'Python', mod: '学习' }, { id: 't6', name: '钻研', mod: '学习' },
      { id: 't7', name: '异环', mod: '游戏' }, { id: 't8', name: '绝区零', mod: '游戏' },
      { id: 't9', name: '星穹铁道', mod: '游戏' }, { id: 't10', name: '原神', mod: '游戏' },
      { id: 't11', name: '健身', mod: '锻炼' }
    ];
    const byId = {};
    TAGS.forEach((t) => { byId[t.id] = t; });
    const pad = (n) => (n < 10 ? '0' + n : '' + n);
    const hm = (m) => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
    const toMin = (x) => { if (!x) return null; const p = x.split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); };
    const dur = (m) => { m = Math.round(m); return m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min'; };
    const durH = (m) => (m >= 6000 ? Math.round(m / 60).toLocaleString('en-US') + ' h' : dur(m));
    const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
    const WK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const wd = (d) => new Date(d + 'T12:00:00Z').getUTCDay();
    const wk = (d) => WK[wd(d)];
    const md = (d) => parseInt(d.slice(5, 7), 10) + '.' + parseInt(d.slice(8, 10), 10);
    const endOf = (r) => (r.e > r.s ? r.e : r.e + 1440);
    const mondayOf = (d) => addDays(d, -((wd(d) + 6) % 7));
    // 示例历史数据（按固定种子生成，保证每次一样）；11.13–11.15 用真实样例
    const gen = () => {
      const out = [];
      let seed = 7, n = 0, d = '2026-01-01';
      const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      const pick = (a) => a[Math.floor(rnd() * a.length)];
      const R = (a, b) => a + Math.floor(rnd() * (b - a + 1));
      while (d < '2026-11-13') {
        const w = wd(d), we = w === 0 || w === 6;
        const add = (tag, s, len) => out.push({ id: 'g' + (n++), tag, date: d, s, e: Math.min(s + len, 1439) });
        if (!we) {
          add(pick(['t2', 't2', 't1', 't4', 't3']), R(540, 600), R(100, 180));
          add(pick(['t1', 't4', 't2', 't4']), R(840, 900), R(120, 230));
          if (rnd() < 0.5) add(rnd() < 0.8 ? 't6' : 't5', R(1170, 1200), R(40, 90));
          if (rnd() < 0.6) add(pick(['t9', 't8', 't10', 't7', 't9']), R(1300, 1340), R(30, 95));
          if ((w === 1 || w === 3 || w === 5) && rnd() < 0.6) add('t11', R(1080, 1100), R(40, 60));
        } else {
          if (rnd() < 0.4) add('t6', R(600, 640), R(60, 110));
          add(pick(['t9', 't8', 't10', 't9']), R(780, 840), R(120, 220));
          if (rnd() < 0.3) add('t11', R(1080, 1100), R(40, 60));
          if (rnd() < 0.7) add(pick(['t9', 't8', 't10', 't7']), R(1200, 1260), R(60, 150));
        }
        d = addDays(d, 1);
      }
      return out;
    };
    const T = TODAY, Y = '2026-11-14', B = '2026-11-13';
    const REAL = [
      { id: 'f1', tag: 't9', date: T, s: 750, e: 966 }, { id: 'f2', tag: 't9', date: T, s: 667, e: 695 },
      { id: 'f3', tag: 't10', date: T, s: 620, e: 669 }, { id: 'f4', tag: 't8', date: T, s: 607, e: 621 },
      { id: 'y1', tag: 't9', date: Y, s: 840, e: 1050 }, { id: 'y2', tag: 't11', date: Y, s: 1140, e: 1210 },
      { id: 'y3', tag: 't6', date: Y, s: 1260, e: 1390 },
      { id: 'b1', tag: 't2', date: B, s: 570, e: 720 }, { id: 'b2', tag: 't1', date: B, s: 810, e: 1090 },
      { id: 'b3', tag: 't10', date: B, s: 1260, e: 1350 }
    ];
    this._lib = { TODAY, MODS, MK: Object.keys(MODS), TAGS, byId, pad, hm, toMin, dur, durH, addDays, wd, wk, md, endOf, mondayOf, seedRecs: () => gen().concat(REAL) };
    return this._lib;
  }

  // 补记录 / 编辑记录弹窗（与今日页同一套）
  edVals(nowMin) {
    const s = this.state || {};
    const ed = s.ed;
    if (!ed) return { edOpen: false };
    const { MODS, MK, TAGS, byId, hm, toMin, dur, addDays, md, endOf, TODAY } = this.lib();
    const recs = s.recs || [];
    const setEd = (patch) => this.setState({ ed: Object.assign({}, this.state.ed, patch) });
    const shift = (key, d) => () => { const v = toMin(this.state.ed[key]); setEd({ [key]: hm((v === null ? nowMin : v) + d) }); };
    const UNSEL = 'inset 0 0 0 1.5px #E1E4EC';
    const sm = toMin(ed.s), em = toMin(ed.e);
    const ok = !!ed.tag && sm !== null && em !== null && em !== sm;
    const length = ok ? (em > sm ? em - sm : em + 1440 - sm) : 0;
    const eEnd = sm !== null && em !== null ? (em > sm ? em : em + 1440) : null;
    const ov = (sm === null || eEnd === null) ? [] : recs.filter((r) => r.date === ed.date && r.id !== ed.id && r.s < eEnd && endOf(r) > sm);
    return {
      edOpen: true,
      edTitle: ed.mode === 'edit' ? '编辑记录' : '补一条记录',
      edHint: ed.mode === 'edit' ? '改标签、日期或起止时间都可以，统计会跟着更新' : '忘了点开始也没关系，把那段时间补上就好',
      edIsEdit: ed.mode === 'edit',
      edDate: ed.date, edS: ed.s || '', edE: ed.e || '',
      edNext: sm !== null && em !== null && em < sm ? '· 次日' : '',
      edDur: ok ? dur(length) : '—',
      edSaveOp: ok ? 1 : 0.45,
      edOverlap: ov.length > 0,
      edOverlapText: ov.map((r) => byId[r.tag].name + ' ' + hm(r.s) + '–' + hm(r.e)).join('、'),
      edDays: [[TODAY, '今天'], [addDays(TODAY, -1), '昨天'], [addDays(TODAY, -2), '前天']].map((p) => ({
        label: p[1] + ' ' + md(p[0]),
        bg: ed.date === p[0] ? '#111827' : '#FFFFFF', fg: ed.date === p[0] ? '#FFFFFF' : '#111827',
        ring: ed.date === p[0] ? 'none' : UNSEL,
        pick: () => setEd({ date: p[0] })
      })),
      edGroups: MK.map((k) => ({
        name: k, color: MODS[k].c,
        tags: TAGS.filter((t) => t.mod === k).map((t) => ({
          name: t.name, sel: ed.tag === t.id,
          bg: ed.tag === t.id ? MODS[k].tint : '#FFFFFF',
          fg: ed.tag === t.id ? MODS[k].ink : '#374151',
          ring: ed.tag === t.id ? 'inset 0 0 0 2px ' + MODS[k].c : UNSEL,
          pick: () => setEd({ tag: t.id })
        }))
      })),
      onEdDate: (e) => setEd({ date: e.target.value || this.state.ed.date }),
      onEdS: (e) => setEd({ s: e.target.value }),
      onEdE: (e) => setEd({ e: e.target.value }),
      sMinus: shift('s', -15), sPlus: shift('s', 15), eMinus: shift('e', -15), ePlus: shift('e', 15),
      edClose: () => this.setState({ ed: null }),
      edDelete: () => this.setState({ recs: this.state.recs.filter((r) => r.id !== ed.id), ed: null }),
      edSave: () => {
        if (!ok) return;
        const rec = { id: ed.id || ('n' + (this.state.rseq || 1)), tag: ed.tag, date: ed.date, s: sm, e: em };
        const list = ed.mode === 'edit' ? this.state.recs.map((r) => (r.id === ed.id ? rec : r)) : this.state.recs.concat([rec]);
        this.setState(Object.assign({ recs: list, ed: null, rseq: (this.state.rseq || 1) + 1 }, this.onSaved ? this.onSaved(ed.date) : {}));
      }
    };
  }

  // 右上角"数据已同步"：断联监控（原型里点击可切换三种状态演示）
  syncVals() {
    const st = (this.state && this.state.sync) || 'ok';
    const S = {
      ok: { label: '数据已同步', tip: '服务器连接正常，上次保存 17:20', dot: '#14B8A6', bg: 'transparent', fg: '#4B5263', ring: 'none', cls: 'live' },
      saving: { label: '正在保存…', tip: '正在把刚才的改动写入数据库', dot: '#E5A800', bg: 'transparent', fg: '#4B5263', ring: 'none', cls: 'live' },
      off: { label: '连接断开 · 2 条待保存', tip: '暂时连不上服务器，改动先存在本机，恢复后自动补传', dot: '#F2711C', bg: '#FFF7F1', fg: '#9A3A0A', ring: 'inset 0 0 0 1.5px #FFB38A', cls: '' }
    };
    const v = S[st], order = ['ok', 'saving', 'off'];
    return { syncLabel: v.label, syncTip: v.tip + '（原型：点击切换演示状态）', syncDot: v.dot, syncBg: v.bg, syncFg: v.fg, syncRing: v.ring, syncDotCls: v.cls,
      syncCycle: () => this.setState({ sync: order[(order.indexOf(st) + 1) % 3] }) };
  }


  componentDidMount() {
    const L = this.lib();
    this._t0 = Date.now();
    this.setState({ recs: L.seedRecs().filter((r) => r.date >= '2026-09-01'), week: L.mondayOf(L.TODAY), drag: null, ed: null, rseq: 1 });
    this._iv = setInterval(() => this.forceUpdate(), 30000);
  }
  componentWillUnmount() { clearInterval(this._iv); }
  onSaved(date) { return { week: this.lib().mondayOf(date) }; }

  renderVals() {
    const L = this.lib();
    const { MODS, MK, byId, hm, dur, addDays, wk, md, endOf, mondayOf, TODAY } = L;
    const s = this.state || {};
    const recs = s.recs || [];
    const week = s.week || mondayOf(TODAY);
    const H0 = 6 * 60, H1 = 24 * 60, PX = 44;
    const H = (H1 - H0) / 60 * PX;
    const y = (m) => (Math.max(H0, Math.min(H1, m)) - H0) / 60 * PX;
    const now = Date.now();
    const nowMin = 17 * 60 + 20 + Math.floor((now - (this._t0 || now)) / 60000);
    const snap = (py) => Math.max(H0, Math.min(H1, H0 + Math.round(py / PX * 60 / 15) * 15));
    const drag = s.drag;

    const days = [0, 1, 2, 3, 4, 5, 6].map((i) => {
      const date = addDays(week, i);
      const list = recs.filter((r) => r.date === date).map((r) => ({ r, s: r.s, e2: Math.min(endOf(r), H1) }))
        .filter((x) => x.e2 > H0).sort((a, b) => a.s - b.s);
      // 同一时间的多条记录并排显示
      const out = [];
      let cluster = [], end = -1;
      const flush = () => {
        const lanes = [];
        cluster.forEach((x) => { let k = lanes.findIndex((e) => e <= x.s); if (k < 0) { k = lanes.length; lanes.push(0); } lanes[k] = x.e2; x.lane = k; });
        cluster.forEach((x) => { x.lanes = lanes.length; out.push(x); });
        cluster = [];
      };
      list.forEach((x) => { if (x.s >= end && cluster.length) flush(); cluster.push(x); end = Math.max(end, x.e2); });
      if (cluster.length) flush();
      const total = list.reduce((a, x) => a + (endOf(x.r) - x.r.s), 0);
      const isToday = date === TODAY;
      const isFuture = date > TODAY;
      const dmin = drag && drag.date === date ? Math.min(drag.a, drag.b) : 0;
      const dmax = drag && drag.date === date ? Math.max(drag.a, drag.b) : 0;
      return {
        wk: wk(date), md: md(date),
        dateBg: isToday ? '#FFD43B' : 'transparent',
        colBg: isToday ? '#FFFDF2' : (isFuture ? '#FAFAFC' : '#FFFFFF'),
        total: total ? dur(total) : '—',
        hasNow: isToday, nowTop: y(nowMin),
        hasDrag: !!(drag && drag.date === date),
        dragTop: y(dmin), dragH: Math.max(y(dmax) - y(dmin), 18),
        dragLabel: hm(dmin) + ' – ' + hm(Math.max(dmax, dmin + 15)),
        down: (e) => {
          if (isFuture) return;
          if (e.target && e.target.closest && e.target.closest('[data-block]')) return;
          if (e.preventDefault) e.preventDefault();
          this._rect = e.currentTarget.getBoundingClientRect();
          const m = snap(e.clientY - this._rect.top);
          this.setState({ drag: { date, a: m, b: m + 15 } });
        },
        move: (e) => {
          const d = this.state.drag;
          if (!d || d.date !== date || !this._rect) return;
          const m = snap(e.clientY - this._rect.top);
          if (m !== d.b) this.setState({ drag: Object.assign({}, d, { b: m }) });
        },
        blocks: out.map((x) => {
          const t = byId[x.r.tag], m = MODS[t.mod];
          const h = y(x.e2) - y(x.s);
          return {
            top: y(x.s) + 1, h: Math.max(h - 2, 18),
            left: (x.lane / x.lanes * 100).toFixed(2), width: (100 / x.lanes).toFixed(2),
            tint: m.tint, color: m.c, ink: m.ink, name: t.name,
            range: hm(x.r.s) + '–' + hm(x.r.e), rangeDisp: h >= 34 ? 'block' : 'none',
            pad: h < 24 ? '0 6px' : '3px 6px', just: h < 24 ? 'center' : 'flex-start',
            aria: t.name + ' ' + hm(x.r.s) + '–' + hm(x.r.e) + '，点击编辑',
            open: () => this.setState({ ed: { mode: 'edit', id: x.r.id, tag: x.r.tag, date: x.r.date, s: hm(x.r.s), e: hm(x.r.e) } })
          };
        })
      };
    });

    const weekTotal = recs.filter((r) => r.date >= week && r.date <= addDays(week, 6)).reduce((a, r) => a + endOf(r) - r.s, 0);
    const hours = [];
    for (let h = 7; h <= 23; h += 1) hours.push({ top: (h * 60 - H0) / 60 * PX, label: (h < 10 ? '0' : '') + h + ':00' });

    return Object.assign({
      H, PX, days, hours,
      legend: MK.map((k) => ({ name: k, color: MODS[k].c })),
      weekLabel: md(week) + ' – ' + md(addDays(week, 6)),
      weekTotal: dur(weekTotal),
      nextOp: week >= mondayOf(TODAY) ? 0.35 : 1,
      prevWeek: () => this.setState({ week: addDays(this.state.week, -7) }),
      nextWeek: () => { if (this.state.week < mondayOf(TODAY)) this.setState({ week: addDays(this.state.week, 7) }); },
      thisWeek: () => this.setState({ week: mondayOf(TODAY) }),
      endDrag: () => {
        const d = this.state && this.state.drag;
        if (!d) return;
        let a = Math.min(d.a, d.b), b = Math.max(d.a, d.b);
        if (b - a < 15) b = a + 60;
        this._rect = null;
        this.setState({ drag: null, ed: { mode: 'new', tag: null, date: d.date, s: hm(a), e: hm(Math.min(b, 1439)) } });
      }
    }, this.edVals(nowMin), this.syncVals());
  }
}
</script>
